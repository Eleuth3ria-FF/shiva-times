name: Sync Sleeper Data

on:
  schedule:
    # Every 6 hours. Sleeper's own data doesn't update faster than
    # this during the week anyway; tighten this during game windows
    # later if we want closer-to-live standings on Sundays.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sleeper sync
        run: python scripts/sync_sleeper.py

      - name: Commit updated data
        run: |
          git config user.name "shiva-times-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-sync Sleeper data"
          git push
