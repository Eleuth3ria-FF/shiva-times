name: Sync Sleeper Data

on:
  schedule:
    # Every hour, at 7 minutes past: GitHub's scheduler is busiest right at :00,
    # so an off-peak minute tends to start closer to on time. Free for a public repo.
    - cron: '7 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

# Never run two syncs at once (e.g. a manual run during a scheduled one): they would race to save the same files.
concurrency:
  group: sync-sleeper
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sleeper sync
        run: python scripts/sync_sleeper.py

      - name: Commit updated data
        run: |
          git config user.name "shiva-times-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Auto-sync Sleeper data"
            # If you uploaded files to the repo while this run was in progress, replay our data commit on top of yours.
            git pull --rebase origin main
            git push
          fi
